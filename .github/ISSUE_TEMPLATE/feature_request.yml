name: Feature idea
description: Suggest a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Include alternatives you considered. Label any proposed hardware behavior as untested.
    validations:
      required: true
