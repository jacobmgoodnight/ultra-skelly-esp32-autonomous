name: Skelly Studio smoke tests
on:
  push:
    paths:
      - "studio/**"
      - "firmware/**"
      - "tests/**"
      - "scripts/**"
      - "experiments/BodyComboSingleTest/**"
      - "experiments/SerialIdleTest/**"
      - ".github/workflows/studio-checks.yml"
  pull_request:
    paths:
      - "studio/**"
      - "firmware/**"
      - "tests/**"
      - "scripts/**"
      - "experiments/BodyComboSingleTest/**"
      - "experiments/SerialIdleTest/**"
      - ".github/workflows/studio-checks.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check studio/app.js
          node --check studio/template.js
      - name: Check generated Arduino output and constraints
        run: node --test studio/tests/*.test.cjs
      - name: Check canonical firmware and browser template match
        run: node scripts/sync-template.cjs --check
      - name: Execute firmware with mocked BLE and clock
        run: python tests/run_firmware_tests.py
      - name: Verify CRC test vectors
        run: python tests/test_packets.py
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install Espressif ESP32 core (3.3.12)
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Generate representative Arduino sketches
        run: node studio/tests/export-samples.cjs
      - name: Compile each generated sketch for ESP32 Dev Module
        run: |
          set -e
          for sketch in .skelly-build/*; do
            test -f "$sketch/$(basename "$sketch").ino" || continue
            echo "Compiling $sketch"
            arduino-cli compile --fqbn esp32:esp32:esp32 "$sketch"
          done
      - name: Compile canonical firmware
        run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/SkellyAutonomous
      - name: Compile isolated compound motor test (HEAD+ARM first)
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 experiments/BodyComboSingleTest
      - name: Compile serial-only idle diagnostic
        run: arduino-cli compile --fqbn esp32:esp32:esp32 experiments/SerialIdleTest
