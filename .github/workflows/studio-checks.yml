name: Skelly Studio smoke tests
on:
  push:
    paths:
      - "studio/**"
      - "firmware/**"
      - "tests/**"
      - "scripts/**"
      - "experiments/**"
      - ".github/workflows/studio-checks.yml"
  pull_request:
    paths:
      - "studio/**"
      - "firmware/**"
      - "tests/**"
      - "scripts/**"
      - "experiments/**"
      - ".github/workflows/studio-checks.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for source in studio/*.js; do node --check "$source"; done
      - name: Check generated Arduino output and constraints
        run: node --test studio/tests/*.test.cjs
      - name: Check canonical firmware and browser template match
        run: |
          node scripts/sync-runtime-schema.cjs --check
          node scripts/sync-template.cjs --check
          node scripts/prepare-owner-tools.cjs --check
      - name: Check Studio asset cache versions
        run: node scripts/version-studio-assets.cjs --check
      - name: Execute firmware with mocked BLE and clock
        run: python tests/run_firmware_tests.py
      - name: Verify CRC test vectors
        run: |
          python tests/test_packets.py
          python tests/test_prebuilt.py
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install Espressif ESP32 core (3.3.12)
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile complete pinned ESP32 matrix with a shared scratch cache
        run: python scripts/compile-validation.py
      - name: Preserve compiled source hashes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-source-hashes-${{ github.run_id }}
          path: .skelly-build/validation/results.json
          if-no-files-found: error
