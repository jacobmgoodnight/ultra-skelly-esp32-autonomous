name: Skelly Studio smoke tests
on:
  push:
    paths:
      - "studio/**"
      - ".github/workflows/studio-checks.yml"
  pull_request:
    paths:
      - "studio/**"
      - ".github/workflows/studio-checks.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check studio/app.js
          node --check studio/template.js
      - name: Check generated Arduino output and constraints
        run: node --test studio/tests/generator.test.cjs
      - name: Verify CRC test vectors
        run: python tests/test_packets.py
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install Espressif ESP32 core (3.3.12)
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Generate representative Arduino sketches
        run: node studio/tests/export-samples.cjs
      - name: Compile each generated sketch for ESP32 Dev Module
        run: |
          set -e
          for sketch in .skelly-build/*; do
            echo "Compiling $sketch"
            arduino-cli compile --fqbn esp32:esp32:esp32 "$sketch"
          done
